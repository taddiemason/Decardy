name = "decardy"
main = "worker.js"
compatibility_date = "2024-09-23"

# If you want to bind to your real domain:
# routes = [
#   { pattern = "decardy.com/*", zone_name = "decardy.com" }
# ]

[assets]
# Serve static files from repo root so existing image/logo paths resolve
# without duplicating binary assets under public/.
directory = "./"
binding = "ASSETS"
not_found_handling = "single-page-application"
