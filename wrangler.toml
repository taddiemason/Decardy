name = "decardy"
main = "worker.js"
compatibility_date = "2024-09-23"

# If you want to bind to your real domain:
# routes = [
#   { pattern = "decardy.com/*", zone_name = "decardy.com" }
# ]

[assets]
# Serve static files from a dedicated public directory to avoid uploading
# development dependencies (for example node_modules) as assets.
directory = "./public"
binding = "ASSETS"
html_handling = "none"
